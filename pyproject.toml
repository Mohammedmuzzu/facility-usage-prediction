[project]
name = "facility-usage-prediction"
version = "2.0.0"
description = "Reproducible, temporal next-booking prediction for residential facilities"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
